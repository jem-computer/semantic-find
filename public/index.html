<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semantic Find · TypeSafe AI</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/hljs-github.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<aside class="sidebar">
  <header class="brand">
    <img src="typesafe_logo.svg" alt="TypeSafe" class="logo">
    <div class="app-name">semantic find</div>
  </header>

  <label class="field-label" for="doc-select">document</label>
  <div class="select-wrap">
    <select id="doc-select"></select>
  </div>
  <button id="paste-open" class="paste-open" type="button">+ paste your own</button>

  <label class="field-label" for="query">ask the document</label>
  <form id="search-form">
    <div class="search-box">
      <input id="query" type="text" autocomplete="off" spellcheck="false"
             placeholder="do I own the images I upload?">
      <button id="search-btn" type="submit" aria-label="search">→</button>
    </div>
  </form>

  <div class="mode-toggle" role="radiogroup" aria-label="search mode">
    <button type="button" id="mode-choice" class="mode-btn active"
            title="One Choice over all lines — scores are shares of one probability mass. Best for pinpointing.">which line?</button>
    <button type="button" id="mode-score" class="mode-btn"
            title="One Score per line against a relevance rubric — absolute readings, nothing forced to win. Best for evidence chains.">score each line</button>
  </div>

  <div id="suggestions" class="suggestions"></div>

  <div id="verdict" class="verdict" hidden>
    <div class="verdict-chip" id="verdict-chip"></div>
    <div class="verdict-meta" id="verdict-meta"></div>
  </div>

  <div id="matches" class="matches" hidden>
    <div class="field-label">top matches</div>
    <ol id="match-list"></ol>
  </div>

  <footer class="sidebar-foot">
    <span id="doc-source"></span>
    <span>one request · whole document ·<br>“which line?” + “does one exist?”</span>
  </footer>
</aside>

<main class="doc-pane">
  <div class="doc-scroll" id="doc-scroll">
    <article class="doc" id="doc">
      <h1 id="doc-title"></h1>
      <div id="doc-lines"></div>
    </article>
  </div>
  <div class="minimap" id="minimap">
    <canvas id="minimap-canvas"></canvas>
    <div class="minimap-viewport" id="minimap-viewport"></div>
  </div>
</main>

<dialog id="paste-dialog">
  <form id="paste-form">
    <div class="field-label">paste a document</div>
    <input id="paste-title" type="text" placeholder="title (optional)" maxlength="80">
    <textarea id="paste-text" rows="14" placeholder="Paste any text — a contract, an article, a log file, source code…"></textarea>
    <div class="mode-toggle paste-kind" role="radiogroup" aria-label="treat pasted text as">
      <button type="button" id="paste-kind-auto" class="mode-btn active"
              title="Detect prose / markdown / log automatically">auto detect</button>
      <button type="button" id="paste-kind-code" class="mode-btn"
              title="Keep lines verbatim — monospace, indentation preserved, syntax highlighted">code</button>
    </div>
    <div class="paste-actions">
      <span id="paste-hint" class="paste-hint">private to this visit · deleted after 2 idle hours</span>
      <button type="button" id="paste-cancel">cancel</button>
      <button type="submit" id="paste-submit">add document</button>
    </div>
  </form>
</dialog>

<script src="vendor/highlight.min.js"></script>
<script src="app.js"></script>
</body>
</html>
